<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <defs>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8c8d8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d2e4f4"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4b28"/>
      <stop offset="55%" stop-color="#2e703d"/>
      <stop offset="100%" stop-color="#489958"/>
    </linearGradient>
  </defs>
  <!-- Glowing ultrahard steel blades in reverse grip -->
  <path d="M84 114 L8 60 L16 52 L92 102 Z" fill="url(#blade)" stroke="#ffffff" stroke-width="2"/>
  <path d="M136 114 L212 60 L204 52 L128 102 Z" fill="url(#blade)" stroke="#ffffff" stroke-width="2"/>
  <!-- Swirling Survey Corps emerald cloak -->
  <path d="M84 68 L136 68 L168 156 Q110 140 52 156 Z" fill="url(#cloak)" stroke="#122d18" stroke-width="4" stroke-linejoin="round"/>
  <!-- White cravat & cropped brown jacket -->
  <path d="M92 70 L128 70 L124 124 L96 124 Z" fill="#7c5230" stroke="#24160c" stroke-width="3"/>
  <path d="M104 68 L116 68 L113 88 L107 88 Z" fill="#f2f0ea"/>
  <!-- ODM steel scabbards at hips -->
  <rect x="66" y="108" width="22" height="32" rx="3" transform="rotate(14 77 124)" fill="#8e9aa6" stroke="#283038" stroke-width="2.5"/>
  <rect x="132" y="108" width="22" height="32" rx="3" transform="rotate(-14 143 124)" fill="#8e9aa6" stroke="#283038" stroke-width="2.5"/>
  <!-- Off-white riding breeches & dark boots -->
  <path d="M96 124 L84 166 L96 168 L108 130 Z" fill="#e6dfd0" stroke="#261b12" stroke-width="2"/>
  <path d="M124 124 L136 166 L124 168 L112 130 Z" fill="#e6dfd0" stroke="#261b12" stroke-width="2"/>
  <path d="M84 164 L78 194 L92 196 L96 166 Z" fill="#231710"/>
  <path d="M136 164 L142 194 L128 196 L124 166 Z" fill="#231710"/>
  <!-- Head with black undercut hair & intense eyes -->
  <circle cx="110" cy="52" r="17" fill="#ecc2a0" stroke="#24160e" stroke-width="3"/>
  <path d="M92 50 C92 30, 128 30, 128 50 L122 44 L112 49 L102 44 Z" fill="#161418"/>
  <path d="M100 54 L107 55 M113 55 L120 54" stroke="#1a1414" stroke-width="2.5" stroke-linecap="round"/>
